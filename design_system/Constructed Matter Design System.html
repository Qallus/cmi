  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

r(--muted-foreground);\n  background: transparent;\n  border: none;\n  cursor: pointer;\n  display: inline-flex; align-items: center; gap: 0.375rem;\n  transition: background 120ms ease, color 120ms ease;\n}\n.cmi-tab:hover { color: var(--foreground); }\n.cmi-tab[aria-selected=\"true\"], .cmi-tab.active {\n  background: var(--card);\n  color: var(--foreground);\n  box-shadow: var(--shadow-xs);\n}\n\n/* Separator + Divider */\n.cmi-sep { height: 1px; background: var(--border); border: 0; margin: 0; }\n.cmi-sep-v { width: 1px; height: 100%; background: var(--border); }\n\n/* Progress */\n.cmi-progress {\n  height: 0.5rem; background: var(--muted);\n  border-radius: 999px; overflow: hidden;\n  position: relative;\n}\n.cmi-progress > .bar {\n  height: 100%; background: var(--accent);\n  border-radius: 999px;\n  transition: width 320ms ease;\n}\n\n/* Alert */\n.cmi-alert {\n  display: flex; gap: 0.75rem;\n  padding: 0.875rem 1rem;\n  border: 1px solid var(--border);\n  background: var(--card);\n  border-radius: var(--radius-md);\n}\n.cmi-alert .icon { color: var(--muted-foreground); margin-top: 1px; flex: 0 0 auto; }\n.cmi-alert .title { font-weight: 600; font-size: 0.875rem; line-height: 1.3; }\n.cmi-alert .desc { font-size: 0.8125rem; color: var(--muted-foreground); margin-top: 0.25rem; line-height: 1.5; }\n.cmi-alert-accent { border-color: color-mix(in oklch, var(--accent) 30%, var(--border)); background: color-mix(in oklch, var(--accent) 6%, var(--card)); }\n.cmi-alert-accent .icon { color: var(--accent); }\n\n/* Table */\n.cmi-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.875rem; }\n.cmi-table thead th {\n  text-align: left;\n  font-size: 0.75rem; font-weight: 500;\n  color: var(--muted-foreground);\n  padding: 0.625rem 0.75rem;\n  border-bottom: 1px solid var(--border);\n  background: var(--card);\n}\n.cmi-table tbody td {\n  padding: 0.75rem;\n  border-bottom: 1px solid var(--border);\n  vertical-align: middle;\n}\n.cmi-table tbody tr:hover { background: color-mix(in oklch, var(--muted) 50%, transparent); }\n.cmi-table tbody tr:last-child td { border-bottom: 0; }\n\n/* Tooltip / KBD */\n.cmi-kbd {\n  display: inline-flex; align-items: center; justify-content: center;\n  min-width: 1.25rem; height: 1.25rem; padding: 0 0.3125rem;\n  font-family: var(--font-mono); font-size: 0.6875rem;\n  background: var(--muted); color: var(--muted-foreground);\n  border: 1px solid var(--border); border-bottom-width: 2px;\n  border-radius: 4px;\n}\n\n/* Logo mark (inline SVG-equivalent) — used for nav */\n.cmi-logo-mark {\n  width: 28px; height: 28px;\n  display: inline-block; flex: 0 0 auto;\n}\n\n/* Utility scroll area */\n.cmi-scroll { overflow-y: auto; }\n.cmi-scroll::-webkit-scrollbar { width: 10px; height: 10px; }\n.cmi-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }\n.cmi-scroll::-webkit-scrollbar-thumb:hover { background: var(--muted-foreground); background-clip: padding-box; border: 2px solid transparent; }\n<\u002Fstyle>\n<style>\n  /* Layout */\n  .ds-shell { display: grid; grid-template-columns: 256px 1fr; min-height: 100vh; }\n  .ds-side {\n    position: sticky; top: 0; height: 100vh;\n    background: var(--card); border-right: 1px solid var(--border);\n    padding: 1.25rem 1rem 1rem; display: flex; flex-direction: column; gap: 0.75rem;\n    overflow-y: auto;\n  }\n  .ds-side .brand { display: flex; align-items: center; gap: 0.625rem; padding: 0.125rem 0.25rem 0.875rem; }\n  .ds-side .brand .name { display: flex; flex-direction: column; line-height: 1.15; }\n  .ds-side .brand .name strong { font-size: 0.875rem; letter-spacing: -0.005em; }\n  .ds-side .brand .name span { font-size: 0.6875rem; color: var(--muted-foreground); letter-spacing: 0.04em; }\n  .ds-side nav { display: flex; flex-direction: column; gap: 0.125rem; }\n  .ds-side .group-label {\n    font-family: var(--font-mono); font-size: 0.625rem;\n    letter-spacing: 0.14em; text-transform: uppercase;\n    color: var(--muted-foreground); padding: 0.875rem 0.5rem 0.375rem;\n  }\n  .ds-side a.item {\n    display: flex; align-items: center; gap: 0.5rem;\n    padding: 0.4375rem 0.5rem;\n    font-size: 0.8125rem; color: var(--muted-foreground);\n    border-radius: var(--radius-md);\n    transition: color 120ms, background 120ms;\n  }\n  .ds-side a.item:hover { color: var(--foreground); background: var(--muted); }\n  .ds-side a.item.active { color: var(--foreground); background: var(--muted); font-weight: 500; }\n  .ds-side a.item .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--accent); opacity: 0; }\n  .ds-side a.item.active .dot { opacity: 1; }\n  .ds-side .ver { margin-top: auto; padding: 0.75rem 0.5rem; font-size: 0.6875rem; color: var(--muted-foreground); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }\n\n  .ds-main { padding: 0; min-width: 0; }\n  .ds-topbar {\n    position: sticky; top: 0; z-index: 5;\n    background: color-mix(in oklch, var(--background) 88%, transparent);\n    backdrop-filter: blur(8px);\n    border-bottom: 1px solid var(--border);\n    height: 56px; display: flex; align-items: center; justify-content: space-between;\n    padding: 0 1.75rem;\n  }\n  .ds-topbar .crumbs { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8125rem; color: var(--muted-foreground); }\n  .ds-topbar .crumbs .sep { opacity: 0.5; }\n  .ds-topbar .crumbs strong { color: var(--foreground); font-weight: 500; }\n  .ds-topbar .actions { display: flex; align-items: center; gap: 0.5rem; }\n  .ds-search {\n    display: inline-flex; align-items: center; gap: 0.5rem;\n    background: var(--muted); color: var(--muted-foreground);\n    border: 1px solid var(--border); border-radius: var(--radius-md);\n    padding: 0 0.5rem; height: 1.875rem; font-size: 0.8125rem;\n    min-width: 240px;\n  }\n  .ds-section { padding: 3rem 2.5rem; max-width: 1240px; }\n  .ds-section + .ds-section { border-top: 1px solid var(--border); }\n  .ds-section-head { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 2rem; }\n  .ds-section-head .cmi-eyebrow { margin: 0; }\n\n  /* Grid utility */\n  .grid { display: grid; gap: 1rem; }\n  .grid-2 { grid-template-columns: repeat(2, 1fr); }\n  .grid-3 { grid-template-columns: repeat(3, 1fr); }\n  .grid-4 { grid-template-columns: repeat(4, 1fr); }\n  .grid-6 { grid-template-columns: repeat(6, 1fr); }\n  @media (max-width: 980px) {\n    .grid-4, .grid-6 { grid-template-columns: repeat(2, 1fr); }\n    .grid-3 { grid-template-columns: 1fr 1fr; }\n  }\n\n  /* Brand showcase */\n  .hero {\n    border: 1px solid var(--border);\n    border-radius: var(--radius-xl);\n    overflow: hidden;\n    background:\n      radial-gradient(120% 80% at 50% 0%, color-mix(in oklch, var(--accent) 14%, transparent) 0%, transparent 60%),\n      var(--card);\n    padding: 2.5rem;\n    display: grid; grid-template-columns: 1.1fr 1fr; gap: 2rem;\n    align-items: center;\n  }\n  .hero .title-block { display: flex; flex-direction: column; gap: 1rem; }\n  .hero h1 { font-family: var(--font-display); font-size: clamp(2rem, 3.5vw, 3rem); line-height: 1.05; letter-spacing: -0.03em; font-weight: 600; margin: 0; }\n  .hero h1 em { font-style: normal; color: var(--accent); }\n  .hero .meta {\n    display: flex; gap: 1.5rem; flex-wrap: wrap;\n    padding-top: 1rem; border-top: 1px solid var(--border); margin-top: 0.5rem;\n    color: var(--muted-foreground); font-size: 0.8125rem;\n  }\n  .hero .meta div { display: flex; flex-direction: column; gap: 0.125rem; }\n  .hero .meta strong { color: var(--foreground); font-weight: 500; font-size: 0.8125rem; font-family: var(--font-mono); }\n  .hero .visual {\n    position: relative; height: 320px;\n    display: flex; align-items: center; justify-content: center;\n  }\n  .hero-grid {\n    position: absolute; inset: 0;\n    background-image:\n      linear-gradient(to right, color-mix(in oklch, var(--border) 80%, transparent) 1px, transparent 1px),\n      linear-gradient(to bottom, color-mix(in oklch, var(--border) 80%, transparent) 1px, transparent 1px);\n    background-size: 28px 28px;\n    mask-image: radial-gradient(circle at center, black 30%, transparent 75%);\n  }\n  .hero .logo-stack { width: 200px; height: 200px; color: var(--foreground); position: relative; z-index: 1; }\n  @media (max-width: 900px) {\n    .hero { grid-template-columns: 1fr; }\n    .hero .visual { height: 240px; }\n  }\n\n  /* Brand cards */\n  .logo-card {\n    border: 1px solid var(--border); border-radius: var(--radius-lg);\n    overflow: hidden;\n    background: var(--card);\n  }\n  .logo-card .preview {\n    aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center;\n    padding: 1.5rem;\n  }\n  .logo-card .meta {\n    padding: 0.875rem 1rem;\n    border-top: 1px solid var(--border);\n    display: flex; align-items: center; justify-content: space-between;\n    font-size: 0.75rem;\n  }\n  .preview-light { background: oklch(0.98 0.005 75); color: oklch(0.16 0.012 60); }\n  .preview-dark { background: oklch(0.16 0.008 60); color: oklch(0.97 0.005 75); }\n  .preview-accent { background: var(--accent); color: var(--accent-foreground); }\n  .preview-concrete { background: var(--surface-concrete); color: var(--foreground); }\n  .logo-card .preview img { max-width: 80%; max-height: 80%; object-fit: contain; }\n  .logo-card .preview svg { width: 64px; height: 64px; color: currentColor; }\n\n  /* 3D logo gallery */\n  .three-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }\n  @media (max-width: 900px) { .three-grid { grid-template-columns: 1fr; } }\n  .three-card {\n    aspect-ratio: 1/1;\n    border: 1px solid var(--border); border-radius: var(--radius-lg);\n    overflow: hidden; position: relative;\n    background: var(--card);\n  }\n  .three-card canvas { width: 100% !important; height: 100% !important; display: block; }\n  .three-card .label {\n    position: absolute; left: 0.875rem; bottom: 0.875rem;\n    display: flex; align-items: center; gap: 0.5rem;\n    background: color-mix(in oklch, var(--card) 80%, transparent);\n    backdrop-filter: blur(6px);\n    border: 1px solid var(--border);\n    padding: 0.375rem 0.625rem;\n    border-radius: var(--radius-md);\n    font-size: 0.75rem; font-weight: 500;\n  }\n  .three-card .swatch { width: 12px; height: 12px; border-radius: 999px; }\n\n  /* Color swatches */\n  .swatch-card {\n    border: 1px solid var(--border); border-radius: var(--radius-md);\n    overflow: hidden; background: var(--card);\n  }\n  .swatch-card .chip { aspect-ratio: 16/10; }\n  .swatch-card .info { padding: 0.625rem 0.75rem; font-size: 0.75rem; }\n  .swatch-card .info .name { font-weight: 500; font-size: 0.8125rem; }\n  .swatch-card .info .token { font-family: var(--font-mono); color: var(--muted-foreground); font-size: 0.6875rem; margin-top: 0.125rem; }\n  .swatch-card .info .value { font-family: var(--font-mono); color: var(--muted-foreground); font-size: 0.6875rem; }\n  .swatch-row { display: grid; grid-template-columns: repeat(11, 1fr); gap: 0; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border); }\n  .swatch-row .step { aspect-ratio: 1/1; display: flex; align-items: flex-end; justify-content: flex-start; padding: 0.375rem 0.5rem; font-size: 0.625rem; font-family: var(--font-mono); }\n\n  /* Type specimen */\n  .type-row { display: grid; grid-template-columns: 130px 1fr; gap: 1.5rem; padding: 1.25rem 0; border-bottom: 1px solid var(--border); align-items: baseline; }\n  .type-row:last-child { border-bottom: 0; }\n  .type-row .label { color: var(--muted-foreground); font-family: var(--font-mono); font-size: 0.75rem; }\n  .type-row .label small { display: block; color: var(--muted-foreground); font-size: 0.6875rem; margin-top: 0.25rem; opacity: 0.7; }\n  .type-row .sample { color: var(--foreground); }\n\n  /* Spacing visual */\n  .spacing-row { display: grid; grid-template-columns: 80px 1fr 80px; gap: 1rem; align-items: center; padding: 0.5rem 0; }\n  .spacing-row .bar { height: 12px; background: var(--accent); border-radius: 4px; }\n  .spacing-row .name { font-family: var(--font-mono); font-size: 0.75rem; }\n  .spacing-row .val { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted-foreground); text-align: right; }\n\n  /* Radius / shadow visuals */\n  .demo-tile {\n    aspect-ratio: 5/3;\n    border: 1px solid var(--border);\n    background: var(--card);\n    display: flex; align-items: center; justify-content: center;\n  }\n  .demo-tile .inner {\n    width: 60%; height: 60%; background: var(--accent);\n  }\n  .shadow-tile {\n    aspect-ratio: 5/3;\n    background: var(--card);\n    border-radius: var(--radius-md);\n    display: flex; align-items: flex-end;\n    padding: 1rem;\n    font-family: var(--font-mono); font-size: 0.75rem;\n    color: var(--muted-foreground);\n  }\n\n  /* Iconography */\n  .icon-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 0.5rem; }\n  @media (max-width: 900px) { .icon-grid { grid-template-columns: repeat(4, 1fr); } }\n  .icon-tile {\n    aspect-ratio: 1/1; border: 1px solid var(--border); border-radius: var(--radius-md);\n    display: flex; flex-direction: column; align-items: center; justify-content: center;\n    gap: 0.375rem; color: var(--muted-foreground); font-family: var(--font-mono); font-size: 0.6875rem;\n    transition: color 120ms, background 120ms;\n    background: var(--card);\n  }\n  .icon-tile:hover { color: var(--foreground); background: var(--muted); }\n  .icon-tile svg { width: 22px; height: 22px; }\n\n  /* Component grid */\n  .ex-card {\n    border: 1px solid var(--border); border-radius: var(--radius-lg);\n    background: var(--card); padding: 1.25rem;\n  }\n  .ex-card .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }\n  .ex-card .head h4 { margin: 0; font-size: 0.875rem; font-weight: 600; }\n  .ex-card .head span { font-family: var(--font-mono); font-size: 0.6875rem; color: var(--muted-foreground); }\n  .ex-card .body { display: flex; flex-direction: column; gap: 0.75rem; min-height: 88px; align-items: flex-start; justify-content: center; }\n  .ex-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }\n\n  /* App mockup card */\n  .mockup-card {\n    border: 1px solid var(--border); border-radius: var(--radius-xl);\n    overflow: hidden;\n    background: var(--card);\n    display: grid; grid-template-columns: 1.3fr 1fr;\n  }\n  @media (max-width: 980px) { .mockup-card { grid-template-columns: 1fr; } }\n  .mockup-card iframe {\n    width: 100%; height: 100%;\n    min-height: 420px;\n    border: 0;\n    background: var(--background);\n  }\n  .mockup-card .info { padding: 1.75rem; display: flex; flex-direction: column; gap: 0.875rem; justify-content: center; border-left: 1px solid var(--border); }\n  @media (max-width: 980px) { .mockup-card .info { border-left: 0; border-top: 1px solid var(--border); } }\n\n  /* Footer */\n  .ds-footer { padding: 2rem 2.5rem; border-top: 1px solid var(--border); color: var(--muted-foreground); font-size: 0.8125rem; display: flex; align-items: center; justify-content: space-between; }\n  .ds-footer .left { display: flex; align-items: center; gap: 0.75rem; }\n  .ds-footer .left svg { width: 24px; height: 24px; color: var(--foreground); }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"ds-shell\">\n\n  <!-- ============================== SIDE NAV ============================== -->\n  <aside class=\"ds-side cmi-scroll\">\n    <div class=\"brand\">\n      <span class=\"cmi-logo-mark\" id=\"brandMark\"><\u002Fspan>\n      <div class=\"name\">\n        <strong>Constructed Matter<\u002Fstrong>\n        <span>DESIGN SYSTEM · v1.0<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <nav>\n      <div class=\"group-label\">Foundations<\u002Fdiv>\n      <a class=\"item active\" href=\"#overview\"><span class=\"dot\"><\u002Fspan>Overview<\u002Fa>\n      <a class=\"item\" href=\"#brand\"><span class=\"dot\"><\u002Fspan>Brand<\u002Fa>\n      <a class=\"item\" href=\"#3d-logo\"><span class=\"dot\"><\u002Fspan>3D Mark · Embossed<\u002Fa>\n      <a class=\"item\" href=\"#3d-cutout\"><span class=\"dot\"><\u002Fspan>3D Mark · Cut-through<\u002Fa>\n      <a class=\"item\" href=\"#color\"><span class=\"dot\"><\u002Fspan>Color<\u002Fa>\n      <a class=\"item\" href=\"#type\"><span class=\"dot\"><\u002Fspan>Typography<\u002Fa>\n      <a class=\"item\" href=\"#spacing\"><span class=\"dot\"><\u002Fspan>Spacing &amp; Radius<\u002Fa>\n      <a class=\"item\" href=\"#elevation\"><span class=\"dot\"><\u002Fspan>Elevation<\u002Fa>\n      <a class=\"item\" href=\"#icons\"><span class=\"dot\"><\u002Fspan>Iconography<\u002Fa>\n\n      <div class=\"group-label\">Components<\u002Fdiv>\n      <a class=\"item\" href=\"#buttons\"><span class=\"dot\"><\u002Fspan>Buttons<\u002Fa>\n      <a class=\"item\" href=\"#forms\"><span class=\"dot\"><\u002Fspan>Forms &amp; Inputs<\u002Fa>\n      <a class=\"item\" href=\"#datadisplay\"><span class=\"dot\"><\u002Fspan>Data Display<\u002Fa>\n      <a class=\"item\" href=\"#feedback\"><span class=\"dot\"><\u002Fspan>Feedback<\u002Fa>\n      <a class=\"item\" href=\"#charts\"><span class=\"dot\"><\u002Fspan>Charts<\u002Fa>\n\n      <div class=\"group-label\">Applications<\u002Fdiv>\n      <a class=\"item\" href=\"#frontend\"><span class=\"dot\"><\u002Fspan>Marketing Site<\u002Fa>\n      <a class=\"item\" href=\"#crm\"><span class=\"dot\"><\u002Fspan>CRM Dashboard<\u002Fa>\n\n      <div class=\"group-label\">Resources<\u002Fdiv>\n      <a class=\"item\" href=\"#tokens-export\"><span class=\"dot\"><\u002Fspan>Token Export<\u002Fa>\n      <a class=\"item\" href=\"#guidelines\"><span class=\"dot\"><\u002Fspan>Usage Guidelines<\u002Fa>\n    <\u002Fnav>\n\n    <div class=\"ver\">\n      <span>v1.0 · May 2026<\u002Fspan>\n      <span class=\"cmi-mono\">ROC 343120<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <!-- ============================== MAIN ============================== -->\n  <main class=\"ds-main\">\n\n    <!-- Topbar -->\n    <div class=\"ds-topbar\">\n      <div class=\"crumbs\">\n        <span>Design System<\u002Fspan>\n        <span class=\"sep\">/<\u002Fspan>\n        <strong id=\"crumbActive\">Overview<\u002Fstrong>\n      <\u002Fdiv>\n      <div class=\"actions\">\n        <div class=\"ds-search\">\n          <svg class=\"icon\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"><\u002Fcircle><path d=\"m21 21-4.3-4.3\"><\u002Fpath><\u002Fsvg>\n          <span>Search tokens, components…<\u002Fspan>\n          <span style=\"flex:1\"><\u002Fspan>\n          <span class=\"cmi-kbd\">⌘K<\u002Fspan>\n        <\u002Fdiv>\n        <button class=\"cmi-btn cmi-btn-ghost cmi-btn-icon cmi-btn-sm\" id=\"themeToggle\" title=\"Toggle theme\">\n          <svg class=\"icon icon-sun\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><path d=\"M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41\"><\u002Fpath><\u002Fsvg>\n        <\u002Fbutton>\n        <a class=\"cmi-btn cmi-btn-outline cmi-btn-sm\" href=\"marketing.html\">View site →<\u002Fa>\n        <a class=\"cmi-btn cmi-btn-primary cmi-btn-sm\" href=\"dashboard.html\">Open CRM →<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ====================== Overview ====================== -->\n    <section class=\"ds-section\" id=\"overview\">\n      <div class=\"hero\">\n        <div class=\"title-block\">\n          <span class=\"cmi-eyebrow\">Constructed Matter · Design System<\u002Fspan>\n          <h1>A system <em>built<\u002Fem> on craftsmanship,<br>not chrome.<\u002Fh1>\n          <p class=\"cmi-lead\" style=\"max-width: 46ch;\">\n            A ShadCN-aligned token system tuned for Arizona's premier construction firm.\n            Stone neutrals, copper accents, monolinear marks. One vocabulary across the\n            marketing site, the client dashboard, and the field CRM.\n          <\u002Fp>\n          <div class=\"ex-row\" style=\"gap: 0.5rem; margin-top: 0.25rem;\">\n            <a href=\"#brand\" class=\"cmi-btn cmi-btn-primary\">Start with Brand<\u002Fa>\n            <a href=\"#crm\" class=\"cmi-btn cmi-btn-outline\">See applications<\u002Fa>\n          <\u002Fdiv>\n          <div class=\"meta\">\n            <div><span>Tokens<\u002Fspan><strong>34<\u002Fstrong><\u002Fdiv>\n            <div><span>Components<\u002Fspan><strong>22<\u002Fstrong><\u002Fdiv>\n            <div><span>Charts<\u002Fspan><strong>5<\u002Fstrong><\u002Fdiv>\n            <div><span>Mockups<\u002Fspan><strong>2<\u002Fstrong><\u002Fdiv>\n            <div><span>Theme<\u002Fspan><strong>Light · Dark<\u002Fstrong><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"visual\">\n          <div class=\"hero-grid\"><\u002Fdiv>\n          <div class=\"logo-stack\" id=\"heroMark\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ====================== Brand ====================== -->\n    <section class=\"ds-section\" id=\"brand\">\n      <div class=\"ds-section-head\">\n        <span class=\"cmi-eyebrow\">01 · Foundations<\u002Fspan>\n        <h2 class=\"cmi-h2\">Brand<\u002Fh2>\n        <p class=\"cmi-lead\" style=\"max-width: 64ch;\">\n          The mark is a hexagonal lattice — six structural nodes forming a single bond.\n          It reads as \"constructed matter\" at any scale. Do not redraw it; use the supplied lockups.\n        <\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"grid grid-4\">\n        <div class=\"logo-card\">\n          <div class=\"preview preview-light\"><img src=\"b1a56f7e-28c3-4e15-ac5a-04c9a95371c9\" alt=\"Primary lockup\"><\u002Fdiv>\n          <div class=\"meta\"><span class=\"cmi-mono\">Primary · Light<\u002Fspan><span class=\"cmi-badge cmi-badge-outline\">Logo<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"logo-card\">\n          <div class=\"preview preview-dark\"><img src=\"0c27ecf9-2846-4555-b367-6f2c8693ea70\" alt=\"Reversed lockup\"><\u002Fdiv>\n          <div class=\"meta\"><span class=\"cmi-mono\">Reversed · Dark<\u002Fspan><span class=\"cmi-badge cmi-badge-outline\">Logo<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"logo-card\">\n          <div class=\"preview preview-light\"><img src=\"89f16602-8460-4b5b-b338-e93cdc20999b\" alt=\"Stacked lockup\"><\u002Fdiv>\n          <div class=\"meta\"><span class=\"cmi-mono\">Stacked · Light<\u002Fspan><span class=\"cmi-badge cmi-badge-outline\">Logo<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"logo-card\">\n          <div class=\"preview preview-concrete\"><span class=\"cmi-logo-mark\" style=\"width: 88px; height: 88px;\" id=\"brandMark2\"><\u002Fspan><\u002Fdiv>\n          <div class=\"meta\"><span class=\"cmi-mono\">Mark · Solo<\u002Fspan><span class=\"cmi-badge cmi-badge-accent\">Favicon<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"grid grid-3\" style=\"margin-top: 1rem;\">\n        <div class=\"cmi-card\">\n          <div class=\"cmi-card-header\"><div class=\"cmi-card-title\">Clear space<\u002Fdiv><div class=\"cmi-card-desc\">Reserve the height of one node (≈ 14% of mark width) on every side.<\u002Fdiv><\u002Fdiv>\n          <div class=\"cmi-card-body\">\n            <div style=\"padding: 1.25rem; border: 1px dashed var(--accent); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center;\">\n              <span class=\"cmi-logo-mark\" style=\"width: 56px; height: 56px;\" id=\"brandMark3\"><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cmi-card\">\n          <div class=\"cmi-card-header\"><div class=\"cmi-card-title\">Minimum size<\u002Fdiv><div class=\"cmi-card-desc\">Mark: 16px web · 6mm print. Wordmark: 80px web · 22mm print.<\u002Fdiv><\u002Fdiv>\n          <div class=\"cmi-card-body\" style=\"display: flex; align-items: flex-end; gap: 1.5rem;\">\n            <span class=\"cmi-logo-mark\" style=\"width: 16px; height: 16px;\" id=\"brandMark4\"><\u002Fspan>\n            <span class=\"cmi-logo-mark\" style=\"width: 28px; height: 28px;\" id=\"brandMark5\"><\u002Fspan>\n            <span class=\"cmi-logo-mark\" style=\"width: 48px; height: 48px;\" id=\"brandMark6\"><\u002Fspan>\n            <span class=\"cmi-logo-mark\" style=\"width: 72px; height: 72px;\" id=\"brandMark7\"><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cmi-card\">\n          <div class=\"cmi-card-header\"><div class=\"cmi-card-title\">Don't<\u002Fdiv><div class=\"cmi-card-desc\">Don't recolor outside system, distort, or place on busy imagery without scrim.<\u002Fdiv><\u002Fdiv>\n          <div class=\"cmi-card-body\" style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;\">\n            <div style=\"background: oklch(0.92 0.18 145); padding: 0.75rem; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; position: relative;\">\n              <span class=\"cmi-logo-mark\" style=\"width: 32px; height: 32px; color: hotpink;\" id=\"brandMarkBad1\"><\u002Fspan>\n              <span style=\"position:absolute; top:4px; right:6px; font-size:11px; color: var(--destructive); font-weight: 600;\">✕<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"background: var(--card); padding: 0.75rem; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; position: relative; border: 1px solid var(--border);\">\n              <span class=\"cmi-logo-mark\" style=\"width: 48px; height: 18px; color: var(--foreground); display: inline-block;\" id=\"brandMarkBad2\"><\u002Fspan>\n              <span style=\"position:absolute; top:4px; right:6px; font-size:11px; color: var(--destructive); font-weight: 600;\">✕<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ====================== 3D Logo Studio ====================== -->\n    <section class=\"ds-section\" id=\"3d-logo\">\n      <div class=\"ds-section-head\">\n        <span class=\"cmi-eyebrow\">01b · Foundations<\u002Fspan>\n        <h2 class=\"cmi-h2\">3D Mark — Embossed<\u002Fh2>\n        <p class=\"cmi-lead\" style=\"max-width: 64ch;\">\n          The molecule — six atoms locked in a closed hex ring — rises off the face of\n          the puck as a metalwork inlay. Recommended for app icons, splash screens, and\n          motion intros. Drag to orbit · auto-spin pauses on hover.\n        <\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"three-grid\">\n        <div class=\"three-card\" data-variant=\"copper\">\n          <canvas><\u002Fcanvas>\n          <div class=\"label\"><span class=\"swatch\" style=\"background: #c87a3a;\"><\u002Fspan> Copper<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"three-card\" data-variant=\"graphite\">\n          <canvas><\u002Fcanvas>\n          <div class=\"label\"><span class=\"swatch\" style=\"background: #2c2a27;\"><\u002Fspan> Graphite<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"three-card\" data-variant=\"concrete\">\n          <canvas><\u002Fcanvas>\n          <div class=\"label\"><span class=\"swatch\" style=\"background: #cfc7bb;\"><\u002Fspan> Concrete<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"three-card\" data-variant=\"blueprint\">\n          <canvas><\u002Fcanvas>\n          <div class=\"label\"><span class=\"swatch\" style=\"background: #2f6fd1;\"><\u002Fspan> Blueprint<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"three-card\" data-variant=\"oxide\">\n          <canvas><\u002Fcanvas>\n          <div class=\"label\"><span class=\"swatch\" style=\"background: #b13b25;\"><\u002Fspan> Oxide<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"three-card\" data-variant=\"alabaster\">\n          <canvas><\u002Fcanvas>\n          <div class=\"label\"><span class=\"swatch\" style=\"background: #f1ece2;\"><\u002Fspan> Alabaster<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ====================== 3D Logo · Cut-through ====================== -->\n    <section class=\"ds-section\" id=\"3d-cutout\">\n      <div class=\"ds-section-head\">\n        <span class=\"cmi-eyebrow\">01c · Foundations<\u002Fspan>\n        <h2 class=\"cmi-h2\">3D Mark — Cut-through<\u002Fh2>\n        <p class=\"cmi-lead\" style=\"max-width: 64ch;\">\n          Same hex puck, but the molecule is removed from the body — you can see clean\n          through the mark. Use this treatment for hero loops, foyer signage, and any\n          context where light, photography, or video should play through the negative space.\n        <\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"three-grid\">\n        <div class=\"three-card\" data-variant=\"copper\" data-mode=\"cutout\">\n          <canvas><\u002Fcanvas>\n          <div class=\"label\"><span class=\"swatch\" style=\"background: #2a221b;\"><\u002Fspan> Copper · cut<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"three-card\" data-variant=\"graphite\" data-mode=\"cutout\">\n          <canvas><\u002Fcanvas>\n          <div class=\"label\"><span class=\"swatch\" style=\"background: #141312;\"><\u002Fspan> Graphite · cut<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"three-card\" data-variant=\"concrete\" data-mode=\"cutout\">\n          <canvas><\u002Fcanvas>\n          <div class=\"label\"><span class=\"swatch\" style=\"background: #e9e3d6;\"><\u002Fspan> Concrete · cut<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"three-card\" data-variant=\"blueprint\" data-mode=\"cutout\">\n          <canvas><\u002Fcanvas>\n          <div class=\"label\"><span class=\"swatch\" style=\"background: #0e2657;\"><\u002Fspan> Blueprint · cut<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"three-card\" data-variant=\"oxide\" data-mode=\"cutout\">\n          <canvas><\u002Fcanvas>\n          <div class=\"label\"><span class=\"swatch\" style=\"background: #1c1311;\"><\u002Fspan> Oxide · cut<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"three-card\" data-variant=\"alabaster\" data-mode=\"cutout\">\n          <canvas><\u002Fcanvas>\n          <div class=\"label\"><span class=\"swatch\" style=\"background: #f6f1e6;\"><\u002Fspan> Alabaster · cut<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ====================== Color ====================== -->\n    <section class=\"ds-section\" id=\"color\">\n      <div class=\"ds-section-head\">\n        <span class=\"cmi-eyebrow\">02 · Foundations<\u002Fspan>\n        <h2 class=\"cmi-h2\">Color<\u002Fh2>\n        <p class=\"cmi-lead\" style=\"max-width: 64ch;\">\n          Two ramps you'll use every day — <strong>Stone<\u002Fstrong> (warm neutral, ≥99% of surfaces)\n          and <strong>Copper<\u002Fstrong> (single brand accent, ≤5% of any view). Status colors are\n          functional only, never decorative.\n        <\u002Fp>\n      <\u002Fdiv>\n\n      <h3 class=\"cmi-h4\" style=\"margin: 0 0 0.75rem;\">Stone — neutral foundation<\u002Fh3>\n      <div class=\"swatch-row\" id=\"stoneRow\"><\u002Fdiv>\n\n      <h3 class=\"cmi-h4\" style=\"margin: 1.75rem 0 0.75rem;\">Copper — brand accent<\u002Fh3>\n      <div class=\"swatch-row\" id=\"copperRow\"><\u002Fdiv>\n\n      <h3 class=\"cmi-h4\" style=\"margin: 1.75rem 0 0.75rem;\">Semantic tokens<\u002Fh3>\n      <div class=\"grid grid-4\" id=\"semanticGrid\"><\u002Fdiv>\n\n      <h3 class=\"cmi-h4\" style=\"margin: 1.75rem 0 0.75rem;\">Status<\u002Fh3>\n      <div class=\"grid grid-4\">\n        <div class=\"swatch-card\"><div class=\"chip\" style=\"background: var(--success)\"><\u002Fdiv><div class=\"info\"><div class=\"name\">Success<\u002Fdiv><div class=\"token\">--success<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch-card\"><div class=\"chip\" style=\"background: var(--warning)\"><\u002Fdiv><div class=\"info\"><div class=\"name\">Warning<\u002Fdiv><div class=\"token\">--warning<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch-card\"><div class=\"chip\" style=\"background: var(--destructive)\"><\u002Fdiv><div class=\"info\"><div class=\"name\">Destructive<\u002Fdiv><div class=\"token\">--destructive<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch-card\"><div class=\"chip\" style=\"background: var(--info)\"><\u002Fdiv><div class=\"info\"><div class=\"name\">Info<\u002Fdiv><div class=\"token\">--info<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ====================== Type ====================== -->\n    <section class=\"ds-section\" id=\"type\">\n      <div class=\"ds-section-head\">\n        <span class=\"cmi-eyebrow\">03 · Foundations<\u002Fspan>\n        <h2 class=\"cmi-h2\">Typography<\u002Fh2>\n        <p class=\"cmi-lead\" style=\"max-width: 64ch;\">\n          One geometric sans for the whole interface. <strong>Geist<\u002Fstrong> handles display\n          through caption; <strong>Geist Mono<\u002Fstrong> tags data, tokens, and structural metadata.\n        <\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"grid grid-2\" style=\"margin-bottom: 1.5rem;\">\n        <div class=\"cmi-card\">\n          <div class=\"cmi-card-header\"><div class=\"cmi-card-desc\">PRIMARY · Geist<\u002Fdiv><div class=\"cmi-card-title\" style=\"font-size: 2.25rem; line-height: 1; letter-spacing: -0.03em;\">Aa Bb Cc 0123<\u002Fdiv><\u002Fdiv>\n          <div class=\"cmi-card-body\" style=\"font-family: var(--font-sans); color: var(--muted-foreground); font-size: 0.875rem; line-height: 1.6;\">\n            300 Light · 400 Regular · 500 Medium · 600 Semibold · 700 Bold\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cmi-card\">\n          <div class=\"cmi-card-header\"><div class=\"cmi-card-desc\">MONO · Geist Mono<\u002Fdiv><div class=\"cmi-card-title\" style=\"font-family: var(--font-mono); font-size: 2.25rem; line-height: 1; letter-spacing: -0.02em;\">Aa Bb Cc 0123<\u002Fdiv><\u002Fdiv>\n          <div class=\"cmi-card-body\" style=\"font-family: var(--font-mono); color: var(--muted-foreground); font-size: 0.875rem; line-height: 1.6;\">\n            400 Regular · 500 Medium · 600 Semibold · tabular-nums\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"cmi-card\">\n        <div class=\"cmi-card-body\" style=\"padding: 0 1.5rem;\">\n          <div class=\"type-row\">\n            <div class=\"label\">Display / H1<small>56 / 60<\u002Fsmall><\u002Fdiv>\n            <div class=\"sample\" style=\"font-family: var(--font-display); font-size: 3.5rem; line-height: 1; letter-spacing: -0.035em; font-weight: 600;\">Building what matters.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"type-row\">\n            <div class=\"label\">Heading / H2<small>36 / 40<\u002Fsmall><\u002Fdiv>\n            <div class=\"sample\" style=\"font-family: var(--font-display); font-size: 2.25rem; line-height: 1.1; letter-spacing: -0.025em; font-weight: 600;\">A foundation cast in stone.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"type-row\">\n            <div class=\"label\">Heading / H3<small>24 / 30<\u002Fsmall><\u002Fdiv>\n            <div class=\"sample\" style=\"font-size: 1.5rem; line-height: 1.25; letter-spacing: -0.015em; font-weight: 600;\">Concrete decisions, copper highlights.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"type-row\">\n            <div class=\"label\">Heading / H4<small>18 / 26<\u002Fsmall><\u002Fdiv>\n            <div class=\"sample\" style=\"font-size: 1.125rem; line-height: 1.4; font-weight: 600;\">Every detail is structural.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"type-row\">\n            <div class=\"label\">Lead<small>18 / 28<\u002Fsmall><\u002Fdiv>\n            <div class=\"sample\" style=\"font-size: 1.125rem; line-height: 1.55; color: var(--muted-foreground);\">From the first sketch to the final walkthrough, the system stays consistent across every touchpoint a client encounters.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"type-row\">\n            <div class=\"label\">Body<small>14 / 22<\u002Fsmall><\u002Fdiv>\n            <div class=\"sample\" style=\"font-size: 0.875rem; line-height: 1.6;\">Default running text. Rendered at 14px with 22px leading and tracking tuned for screens. Lists, tables, and form values all inherit this baseline.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"type-row\">\n            <div class=\"label\">Caption<small>12 / 18<\u002Fsmall><\u002Fdiv>\n            <div class=\"sample\" style=\"font-size: 0.75rem; line-height: 1.5; color: var(--muted-foreground);\">Metadata, helper text, sub-labels on tables and forms.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"type-row\">\n            <div class=\"label\">Eyebrow<small>11 / 14<\u002Fsmall><\u002Fdiv>\n            <div class=\"sample cmi-eyebrow\">01 · Section identifier<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"type-row\">\n            <div class=\"label\">Mono<small>13 / 20<\u002Fsmall><\u002Fdiv>\n            <div class=\"sample cmi-mono\">PRJ-2026-0184 · scheduled 06/12 · $284,500<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ====================== Spacing & Radius ====================== -->\n    <section class=\"ds-section\" id=\"spacing\">\n      <div class=\"ds-section-head\">\n        <span class=\"cmi-eyebrow\">04 · Foundations<\u002Fspan>\n        <h2 class=\"cmi-h2\">Spacing &amp; Radius<\u002Fh2>\n      <\u002Fdiv>\n\n      <div class=\"grid grid-2\">\n        <div class=\"cmi-card\">\n          <div class=\"cmi-card-header\"><div class=\"cmi-card-title\">Spacing scale<\u002Fdiv><div class=\"cmi-card-desc\">4px base, geometric progression. Compose with gap/grid.<\u002Fdiv><\u002Fdiv>\n          <div class=\"cmi-card-body\" id=\"spacingScale\" style=\"padding: 0.5rem 1.25rem 1.25rem;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cmi-card\">\n          <div class=\"cmi-card-header\"><div class=\"cmi-card-title\">Radius<\u002Fdiv><div class=\"cmi-card-desc\">10px is the system anchor. Buttons and inputs use --radius-md.<\u002Fdiv><\u002Fdiv>\n          <div class=\"cmi-card-body\">\n            <div class=\"grid grid-3\">\n              <div><div class=\"demo-tile\" style=\"border-radius: 4px;\"><div class=\"inner\" style=\"border-radius: 4px;\"><\u002Fdiv><\u002Fdiv><div class=\"cmi-mono\" style=\"margin-top:0.5rem; font-size: 0.6875rem; color: var(--muted-foreground);\">--radius-sm · 6px<\u002Fdiv><\u002Fdiv>\n              <div><div class=\"demo-tile\" style=\"border-radius: 8px;\"><div class=\"inner\" style=\"border-radius: 8px;\"><\u002Fdiv><\u002Fdiv><div class=\"cmi-mono\" style=\"margin-top:0.5rem; font-size: 0.6875rem; color: var(--muted-foreground);\">--radius-md · 8px<\u002Fdiv><\u002Fdiv>\n              <div><div class=\"demo-tile\" style=\"border-radius: 10px;\"><div class=\"inner\" style=\"border-radius: 10px;\"><\u002Fdiv><\u002Fdiv><div class=\"cmi-mono\" style=\"margin-top:0.5rem; font-size: 0.6875rem; color: var(--muted-foreground);\">--radius-lg · 10px<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ====================== Elevation ====================== -->\n    <section class=\"ds-section\" id=\"elevation\">\n      <div class=\"ds-section-head\">\n        <span class=\"cmi-eyebrow\">05 · Foundations<\u002Fspan>\n        <h2 class=\"cmi-h2\">Elevation<\u002Fh2>\n        <p class=\"cmi-lead\">Soft, low-contrast shadows. We don't float — we settle.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"grid grid-4\">\n        <div><div class=\"shadow-tile\" style=\"box-shadow: var(--shadow-xs);\">--shadow-xs<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"shadow-tile\" style=\"box-shadow: var(--shadow-sm);\">--shadow-sm<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"shadow-tile\" style=\"box-shadow: var(--shadow-md);\">--shadow-md<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"shadow-tile\" style=\"box-shadow: var(--shadow-lg);\">--shadow-lg<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ====================== Iconography ====================== -->\n    <section class=\"ds-section\" id=\"icons\">\n      <div class=\"ds-section-head\">\n        <span class=\"cmi-eyebrow\">06 · Foundations<\u002Fspan>\n        <h2 class=\"cmi-h2\">Iconography<\u002Fh2>\n        <p class=\"cmi-lead\">Lucide, 1.75px stroke, 22px nominal. Pair only with their text label or a tooltip.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"icon-grid\" id=\"iconGrid\"><\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ====================== Buttons ====================== -->\n    <section class=\"ds-section\" id=\"buttons\">\n      <div class=\"ds-section-head\">\n        <span class=\"cmi-eyebrow\">07 · Components<\u002Fspan>\n        <h2 class=\"cmi-h2\">Buttons<\u002Fh2>\n      <\u002Fdiv>\n\n      <div class=\"grid grid-2\">\n        <div class=\"ex-card\">\n          <div class=\"head\"><h4>Variants<\u002Fh4><span>btn-*<\u002Fspan><\u002Fdiv>\n          <div class=\"body\">\n            <div class=\"ex-row\">\n              <button class=\"cmi-btn cmi-btn-primary\">Primary<\u002Fbutton>\n              <button class=\"cmi-btn cmi-btn-accent\">Accent<\u002Fbutton>\n rgin-top: 0.75rem;\">Invite subcontractor<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ====================== Charts ====================== -->\n    <section class=\"ds-section\" id=\"charts\">\n      <div class=\"ds-section-head\">\n        <span class=\"cmi-eyebrow\">11 · Components<\u002Fspan>\n        <h2 class=\"cmi-h2\">Charts<\u002Fh2>\n        <p class=\"cmi-lead\">Five-token palette tuned for accessibility on both themes.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"grid grid-2\">\n        <div class=\"cmi-card\">\n          <div class=\"cmi-card-header\"><div class=\"cmi-card-title\">Revenue by service<\u002Fdiv><div class=\"cmi-card-desc\">TTM · in thousands<\u002Fdiv><\u002Fdiv>\n          <div class=\"cmi-card-body\"><svg viewBox=\"0 0 360 180\" width=\"100%\" height=\"180\" id=\"barChart\"><\u002Fsvg><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cmi-card\">\n          <div class=\"cmi-card-header\"><div class=\"cmi-card-title\">Pipeline conversion<\u002Fdiv><div class=\"cmi-card-desc\">Lead → Quote → Booked<\u002Fdiv><\u002Fdiv>\n          <div class=\"cmi-card-body\"><svg viewBox=\"0 0 360 180\" width=\"100%\" height=\"180\" id=\"lineChart\"><\u002Fsvg><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ====================== Frontend ====================== -->\n    <section class=\"ds-section\" id=\"frontend\">\n      <div class=\"ds-section-head\">\n        <span class=\"cmi-eyebrow\">12 · Applications<\u002Fspan>\n        <h2 class=\"cmi-h2\">Marketing site<\u002Fh2>\n        <p class=\"cmi-lead\">Public-facing pages applying the system. Inherits the active theme.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"mockup-card\">\n        <iframe src=\"marketing.html\" title=\"Marketing site preview\" id=\"marketingFrame\" loading=\"lazy\"><\u002Fiframe>\n        <div class=\"info\">\n          <span class=\"cmi-eyebrow\">Live preview<\u002Fspa n cmi-btn-outline cmi-btn-sm\" href=\"dashboard.html\" target=\"_blank\" rel=\"noopener\">View source<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ====================== Tokens Export ====================== -->\n    <section class=\"ds-section\" id=\"tokens-export\">\n      <div class=\"ds-section-head\">\n        <span class=\"cmi-eyebrow\">14 · Resources<\u002Fspan>\n        <h2 class=\"cmi-h2\">Token export<\u002Fh2>\n        <p class=\"cmi-lead\">Copy-paste into a fresh project's <code class=\"cmi-mono\">globals.css<\u002Fcode>.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"cmi-card\">\n        <div class=\"cmi-card-body\">\n          <pre style=\"margin: 0; font-family: var(--font-mono); font-size: 0.75rem; line-height: 1.6; color: var(--muted-foreground); white-space: pre-wrap;\">:root {\n  --radius: 0.625rem;\n  --background:           oklch(0.992 0.003 75);\n  --foreground:           oklch(0.18  0.012 60);\n  --card:                 oklch(1 0 0);\n  --primary:              oklch(0.18  0.012 60);\n  --accent:               oklch(0.66  0.135 52);   /* Arizona copper */\n  --muted:                oklch(0.96  0.005 75);\n  --muted-foreground:     oklch(0.52  0.012 65);\n  --border:               oklch(0.91  0.005 70);\n  --ring:                 oklch(0.66  0.135 52 / 0.45);\n  --destructive:          oklch(0.58  0.215 28);\n  --success:              oklch(0.55  0.13  155);\n  --warning:              oklch(0.74  0.155 78);\n  --info:                 oklch(0.55  0.12  235);\n}\n.dark {\n  --background:           oklch(0.135 0.008 60);\n  --foreground:           oklch(0.97  0.005 75);\n  --card:                 oklch(0.165 0.008 60);\n  --accent:               oklch(0.72  0.135 55);\n  --border:               oklch(0.235 0.008 60);\n}<\u002Fpre>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ====================== Guidelines ====================== -->\n    <section class=\"ds-section\" id=\"guidelines\">\n      <div class=\"ds-section-head\">\n        <span class=\"cmi-eyebrow\">15 · Resources<\u002Fspan>\n        <h2 class=\"cmi-h2\">Usage guidelines<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"grid grid-3\">\n        <div class=\"cmi-card\">\n          <div class=\"cmi-card-header\"><div class=\"cmi-card-title\">Copper is structural<\u002Fdiv><div class=\"cmi-card-desc\">Reserve the accent for the single highest-priority action in any view. Two coppers in one frame is one too many.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cmi-card\">\n          <div class=\"cmi-card-header\"><div class=\"cmi-card-title\">Density follows context<\u002Fdiv><div class=\"cmi-card-desc\">Marketing breathes: 80px stack rhythm. CRM works: 24–32px stack rhythm. Both share the same scale tokens.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cmi-card\">\n          <div class=\"cmi-card-header\"><div class=\"cmi-card-title\">Photography over illustration<\u002Fdiv><div class=\"cmi-card-desc\">Use project photography. Avoid generic illustration; the work is the visual proof.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <div class=\"ds-footer\">\n      <div class=\"left\">\n        <span class=\"cmi-logo-mark\" id=\"footMark\"><\u002Fspan>\n        <span>Constructed Matter, Inc. · Design System v1.0 · May 2026<\u002Fspan>\n      <\u002Fdiv>\n      <span class=\"cmi-mono\">ROC KB1-343120 · Phoenix, AZ<\u002Fspan>\n    <\u002Fdiv>\n\n  <\u002Fmain>\n<\u002Fdiv>\n\n<!-- ============================== TEMPLATES + SCRIPT ============================== -->\n<template id=\"logo-mark-svg\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 763 889\" fill=\"none\" aria-hidden=\"true\" preserveAspectRatio=\"xMidYMid meet\">\n  <g transform=\"matrix(1,0,0,1,1082.67,-1078.99)\">\n    <g transform=\"matrix(13.5164,0,0,13.5164,-623.137,1678.31)\">\n      <path d=\"M0,-22.981C-1.305,-21
